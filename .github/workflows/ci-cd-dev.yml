name: VinaAcademy Frontend - CI/CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  build-app:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.13.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local for build
        run: cp .env.local.example .env.local

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 7

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vinaacademy-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vinaacademy-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/vinaacademy-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to deployment directory
            cd /home/${{ secrets.VPS_USER }}/ms-ci-cd
            
            # Pull latest changes from repository
            git pull origin develop
            
            # Pull latest Docker images
            sudo docker compose -f docker-compose.dev.yml pull vinaacademy-frontend
            
            # Restart vinaacademy-frontend with new image
            sudo docker compose  -f docker-compose.dev.yml up -d vinaacademy-frontend
            
            # Clean up old images
            sudo docker image prune -f
            
            # Check if service is running
            sleep 10
            sudo docker compose  -f docker-compose.dev.yml ps vinaacademy-frontend