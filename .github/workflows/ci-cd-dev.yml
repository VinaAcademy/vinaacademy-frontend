name: VinaAcademy Frontend - CI/CD Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      deploy-environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.13.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  build-app:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.13.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local for build
        run: cp .env.local.example .env.local

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vinaacademy-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vinaacademy-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/vinaacademy-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    environment: ${{ github.event.inputs.deploy-environment || 'development' }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ github.event.inputs.deploy-environment == 'production' && secrets.VPS_PROD_HOST || secrets.VPS_DEV_HOST }}
          username: ${{ github.event.inputs.deploy-environment == 'production' && secrets.VPS_PROD_USERNAME || secrets.VPS_DEV_USERNAME }}
          password: ${{ github.event.inputs.deploy-environment == 'production' && secrets.VPS_PROD_PASSWORD || secrets.VPS_DEV_PASSWORD }}
          port: ${{ github.event.inputs.deploy-environment == 'production' && secrets.VPS_PROD_PORT || secrets.VPS_DEV_PORT || 22 }}
          script: |
            cd /${{ secrets.VPS_USER }}/ms-ci-cd
            sudo docker compose -f services/docker-compose.yml pull vinaacademy-frontend
            sudo docker compose -f services/docker-compose.yml --env-file .env.services up -d vinaacademy-frontend
            sudo docker image prune -f
            sleep 10
            sudo docker compose -f services/docker-compose.yml ps vinaacademy-frontend
